name: Firmware
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
