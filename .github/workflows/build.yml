name: Firmware
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        configuration: [default, diagnostics, frame, ota, encrypted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build ESP32 firmware
        shell: bash
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          . "$IDF_PATH/export.sh"
          if [ "$BUILD_CONFIGURATION" = encrypted ]; then
            espsecure generate-signing-key --version 1 secure_boot_signing_key.pem
            idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.ota;sdkconfig.encrypted' build
            for setting in SECURE_FLASH_ENC_ENABLED SECURE_FLASH_ENCRYPTION_MODE_RELEASE NVS_ENCRYPTION NVS_SEC_KEY_PROTECT_USING_FLASH_ENC FRAME_OTA_ENABLE; do
              grep -qx "CONFIG_${setting}=y" sdkconfig
            done
            grep -qx 'CONFIG_PARTITION_TABLE_OFFSET=0x10000' sdkconfig
            grep -qx 'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.encrypted.csv"' sdkconfig
          elif [ "$BUILD_CONFIGURATION" = ota ]; then
            espsecure generate-signing-key --version 1 secure_boot_signing_key.pem
            idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.ota' build
          elif [ "$BUILD_CONFIGURATION" = diagnostics ]; then
            idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.diagnostics' build
          elif [ "$BUILD_CONFIGURATION" = frame ]; then
            idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.frame' build
          else
            idf.py build
            # Release factory images are merged from this profile.
            # merge-bin resolves its output path inside the build directory.
            idf.py merge-bin -f raw -o factory.bin
            test -s build/factory.bin
          fi
      - name: Host tests with sanitizers
        if: matrix.configuration == 'default'
        shell: bash
        run: tests/run.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/test_browser.mjs
      - run: node tests/test_firmware_browser.mjs
