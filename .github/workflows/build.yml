name: Firmware
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        configuration: [default, diagnostics]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build ESP32 firmware
        shell: bash
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          . "$IDF_PATH/export.sh"
          if [ "$BUILD_CONFIGURATION" = diagnostics ]; then
            idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.diagnostics' build
          else
            idf.py build
          fi
      - name: Host tests with sanitizers
        if: matrix.configuration == 'default'
        shell: bash
        run: tests/run.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/test_browser.mjs
